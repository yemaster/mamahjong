name: ${MAMAHJONG_PROJECT_NAME:-mamahjong}

services:
  database:
    image: postgres:17.10-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MAMAHJONG_DATABASE_NAME:-mamahjong}
      POSTGRES_USER: ${MAMAHJONG_DATABASE_USER:-mamahjong}
      POSTGRES_PASSWORD: ${MAMAHJONG_DATABASE_PASSWORD:-mamahjong-local-password}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  server:
    image: ${MAMAHJONG_SERVER_IMAGE:-mamahjong-server:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    init: true
    restart: unless-stopped
    environment:
      MAMAHJONG_BIND_ADDRESS: 0.0.0.0:8080
      MAMAHJONG_DATA_DIR: /var/lib/mamahjong
      MAMAHJONG_DATABASE_URL: ${MAMAHJONG_DATABASE_URL:-postgresql://${MAMAHJONG_DATABASE_USER:-mamahjong}:${MAMAHJONG_DATABASE_PASSWORD:-mamahjong-local-password}@database:5432/${MAMAHJONG_DATABASE_NAME:-mamahjong}}
      MAMAHJONG_ADMIN_LOGIN_NAME: ${MAMAHJONG_ADMIN_LOGIN_NAME:-admin}
      MAMAHJONG_ADMIN_PASSWORD: ${MAMAHJONG_ADMIN_PASSWORD:-}
      MAMAHJONG_ADMIN_ALLOW_INSECURE_PASSWORD: ${MAMAHJONG_ADMIN_ALLOW_INSECURE_PASSWORD:-false}
      MAMAHJONG_ADMIN_NICKNAME: ${MAMAHJONG_ADMIN_NICKNAME:-管理员}
      MAMAHJONG_ADMIN_COOKIE_SECURE: ${MAMAHJONG_ADMIN_COOKIE_SECURE:-false}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      database:
        condition: service_healthy
    expose:
      - "8080"
    read_only: true
    volumes:
      - match-records:/var/lib/mamahjong
      - user-assets:/var/lib/mamahjong/assets
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  web:
    image: ${MAMAHJONG_WEB_IMAGE:-mamahjong-web:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    environment:
      MAMAHJONG_SERVER_URL: ${MAMAHJONG_SERVER_URL:-http://server:8080}
      MAMAHJONG_ADMIN_WEB_URL: ${MAMAHJONG_ADMIN_WEB_URL:-http://admin-web:8080}
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${MAMAHJONG_WEB_HOST:-127.0.0.1}:${MAMAHJONG_WEB_PORT:-8080}:8080"
    read_only: true
    volumes:
      - user-assets:/var/lib/mamahjong/assets:ro
    tmpfs:
      - /etc/nginx/conf.d:size=1m,mode=0755
      - /var/cache/nginx:size=16m,mode=0755
      - /var/run:size=1m,mode=0755
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  admin-web:
    profiles: ["admin"]
    image: ${MAMAHJONG_ADMIN_WEB_IMAGE:-mamahjong-admin-web:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: admin-web
    restart: unless-stopped
    environment:
      MAMAHJONG_SERVER_URL: ${MAMAHJONG_ADMIN_SERVER_URL:-http://server:8080}
      MAMAHJONG_GAME_WEB_URL: ${MAMAHJONG_ADMIN_GAME_WEB_URL:-http://web:8080}
    depends_on:
      server:
        condition: service_healthy
      web:
        condition: service_started
    expose:
      - "8080"
    read_only: true
    volumes:
      - user-assets:/var/lib/mamahjong/assets:ro
    tmpfs:
      - /etc/nginx/conf.d:size=1m,mode=0755
      - /var/cache/nginx:size=16m,mode=0755
      - /var/run:size=1m,mode=0755
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  match-records:
  postgres-data:
  user-assets:
