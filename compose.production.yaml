name: mamahjong

services:
  database:
    image: postgres:17.10-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MAMAHJONG_DATABASE_NAME:-mamahjong}
      POSTGRES_USER: ${MAMAHJONG_DATABASE_USER:-mamahjong}
      POSTGRES_PASSWORD: ${MAMAHJONG_DATABASE_PASSWORD:?请在 .env.production 中设置数据库密码}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  server:
    image: ${MAMAHJONG_SERVER_IMAGE:-registry.abstrax.cn/mamahjong/server:0.1.0}
    init: true
    restart: unless-stopped
    environment:
      MAMAHJONG_BIND_ADDRESS: 0.0.0.0:8080
      MAMAHJONG_DATA_DIR: /var/lib/mamahjong
      MAMAHJONG_DATABASE_URL: postgresql://${MAMAHJONG_DATABASE_USER:-mamahjong}:${MAMAHJONG_DATABASE_PASSWORD:?请在 .env.production 中设置数据库密码}@database:5432/${MAMAHJONG_DATABASE_NAME:-mamahjong}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      database:
        condition: service_healthy
    expose:
      - "8080"
    read_only: true
    volumes:
      - match-records:/var/lib/mamahjong
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  web:
    image: ${MAMAHJONG_WEB_IMAGE:-registry.abstrax.cn/mamahjong/web:0.1.0}
    restart: unless-stopped
    environment:
      MAMAHJONG_SERVER_URL: ${MAMAHJONG_SERVER_URL:-http://server:8080}
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${MAMAHJONG_WEB_HOST:-127.0.0.1}:${MAMAHJONG_WEB_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:size=1m,mode=0755
      - /var/cache/nginx:size=16m,mode=0755
      - /var/run:size=1m,mode=0755
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  match-records:
  postgres-data:
